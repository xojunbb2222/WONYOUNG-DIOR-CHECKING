<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WONYOUNG × DIOR · Media Tracking</title>
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#151515;--muted:#777;--line:#e8e8e8;--pink:#d9669b;--soft:#fff0f6;--green:#228b61}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1220px;margin:0 auto;padding:32px 18px 64px} h1{font-size:28px;margin:0 0 5px;letter-spacing:-.03em}
.desc{color:var(--muted);font-size:13px;margin-bottom:6px}.meta{font-size:12px;color:#999;margin:12px 0 18px}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:14px 0}.search{width:340px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px}.filter{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1020px}thead th{background:#f7f7f9;color:#555;font-size:11px;text-align:left;padding:10px;border-bottom:1px solid var(--line)}tbody td{padding:10px;border-bottom:1px solid #eee;vertical-align:middle;font-size:12px}tbody tr:last-child td{border-bottom:none}tbody tr.checked{opacity:.45}.num{width:46px;color:#aaa;text-align:center}.account-link{font-weight:800;color:#111;text-decoration:none}.account-link:hover{text-decoration:underline}.date{color:#888;font-size:11px}.caption-cell{max-width:390px}.caption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:390px}.metric{text-align:right;font-variant-numeric:tabular-nums}.status{white-space:nowrap}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.auto{background:var(--soft);color:#b34e7c}.badge.verified{background:#edf8f3;color:var(--green)}.check{margin-left:6px;border:1px solid #e8c6d6;background:#fff7fb;color:#a44e78;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer}.pagination{display:flex;justify-content:center;gap:7px;margin-top:20px;flex-wrap:wrap}.pagination button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:36px;height:36px;cursor:pointer;font-weight:700}.pagination button.active{background:#111;color:#fff;border-color:#111}.pagination button:disabled{opacity:.35}.pageinfo{text-align:center;color:#888;font-size:12px;margin-top:10px}.empty{display:none;text-align:center;color:#999;padding:38px}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#37b879;margin-right:5px}
@media(max-width:720px){h1{font-size:25px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>WONYOUNG × DIOR</h1>
<div class="desc">Instagram Media Tracking · Dior Summer 2027</div>
<div class="meta"><span class="live-dot"></span><span id="total">0</span> posts · <span id="unchecked">0</span> unchecked · auto refresh every 60s</div>
<div class="desc" id="dataNotice">Loading live feed…</div>
<div class="toolbar"><input class="search" id="search" placeholder="Search account or caption…"/><button class="filter" id="filterBtn">ONLY UNCHECKED</button></div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>ACCOUNT</th><th>STATUS</th><th>DATE</th><th>LIKES</th><th>COMMENTS</th><th>VIEWS</th><th>POST</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">No matching posts.</div></div>
<div class="pagination" id="pagination"></div><div class="pageinfo" id="pageinfo"></div>
</div>
<script>
const PER_PAGE=10, KEY='wonyoung_dior_checked_v3';let currentPage=1,onlyUnchecked=false,dataRows=[];
const $=id=>document.getElementById(id);function checkedSet(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){return new Set()}}function saveSet(s){localStorage.setItem(KEY,JSON.stringify([...s]))}function fmt(n){n=Number(n||0);if(!n)return '—';return new Intl.NumberFormat('en',{notation:n>=10000?'compact':'standard',maximumFractionDigits:1}).format(n)}
function filtered(){const q=$('search').value.toLowerCase().trim(),checked=checkedSet();return dataRows.filter(x=>(!q||(`${x.account} ${x.caption}`).toLowerCase().includes(q))&&(!onlyUnchecked||!checked.has(String(x.id))))}
function render(){const checked=checkedSet(),rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/PER_PAGE));currentPage=Math.max(1,Math.min(currentPage,pages));const start=(currentPage-1)*PER_PAGE;$('tbody').replaceChildren();rows.slice(start,start+PER_PAGE).forEach((p,i)=>{const tr=document.createElement('tr');if(checked.has(String(p.id)))tr.classList.add('checked');const vals=[start+i+1];let td=document.createElement('td');td.className='num';td.textContent=vals[0];tr.append(td);td=document.createElement('td');const a=document.createElement('a');a.className='account-link';a.href=p.url;a.target='_blank';a.rel='noopener';a.textContent='@'+(p.account||'unknown');td.append(a);tr.append(td);td=document.createElement('td');td.className='status';const b=document.createElement('span');const verified=['manually_verified','source_verified'].includes(p.review_status);b.className='badge '+(verified?'verified':'auto');b.textContent=verified?'VERIFIED':'AUTO';td.append(b);const c=document.createElement('button');c.className='check';c.textContent=checked.has(String(p.id))?'CHECKED ✓':'CHECK';c.onclick=()=>{const s=checkedSet();s.has(String(p.id))?s.delete(String(p.id)):s.add(String(p.id));saveSet(s);render()};td.append(c);tr.append(td);td=document.createElement('td');td.className='date';td.textContent=String(p.date||'').slice(0,10)||'—';tr.append(td);for(const k of ['likes','comments','views']){td=document.createElement('td');td.className='metric';td.textContent=fmt(p[k]);tr.append(td)}td=document.createElement('td');td.className='caption-cell';const d=document.createElement('div');d.className='caption';d.textContent=p.caption||'';d.title=p.caption||'';td.append(d);tr.append(td);$('tbody').append(tr)});$('total').textContent=dataRows.length;$('unchecked').textContent=dataRows.filter(x=>!checked.has(String(x.id))).length;$('empty').style.display=rows.length?'none':'block';const pg=$('pagination');pg.replaceChildren();const btn=(t,fn,dis,active)=>{const b=document.createElement('button');b.textContent=t;b.disabled=dis;if(active)b.className='active';b.onclick=fn;pg.append(b)};btn('‹',()=>{currentPage--;render()},currentPage===1);for(let i=1;i<=pages;i++)btn(String(i),()=>{currentPage=i;render()},false,i===currentPage);btn('›',()=>{currentPage++;render()},currentPage===pages);$('pageinfo').textContent=rows.length?`Page ${currentPage} of ${pages} · ${rows.length} records`:'0 records'}
async function load(silent=false){try{const r=await fetch('./posts.json?cache='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const list=Array.isArray(d)?d:d.posts;if(!Array.isArray(list))throw Error('Invalid posts.json');const used=new Set();dataRows=list.filter(x=>x&&x.id&&x.url&&!used.has(String(x.id))&&used.add(String(x.id))).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));$('dataNotice').textContent=`Live media feed · last data update: ${d.updated_at||'unknown'} · AUTO = machine-discovered, VERIFIED = manually/source verified`;render()}catch(e){if(!silent)$('dataNotice').textContent='Unable to load live feed: '+e.message}}
$('search').oninput=()=>{currentPage=1;render()};$('filterBtn').onclick=()=>{onlyUnchecked=!onlyUnchecked;$('filterBtn').textContent=onlyUnchecked?'SHOW ALL':'ONLY UNCHECKED';currentPage=1;render()};load();setInterval(()=>load(true),60000);
</script>
</body>
</html>
