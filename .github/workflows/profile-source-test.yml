name: Check Instagram Account Posts (One Time)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Profile-first source cross-check (may incur Bright Data charges)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python check_media_profile.py
      - name: Upload report whether successful or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-source-check
          path: profile-source-check.json
          retention-days: 7
          if-no-files-found: warn
