name: Test New Instagram Posts (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Collect at most 15 uncollected posts
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python collect_new_posts.py
      - name: Upload review files (including on failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonyoung-media-review
          path: |
            batch-plan.json
            media-review.json
            batch-response-metadata.json
          if-no-files-found: warn
          retention-days: 7
