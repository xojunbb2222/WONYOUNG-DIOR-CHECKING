name: Discover global WONYOUNG Dior media
on:
  workflow_dispatch:
  # Enable after reviewing the first results and confirming Bright Data costs:
  # schedule:
  #   - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: wonyoung-media-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Find new media posts (limited Bright Data usage)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python update_media.py
      - name: Commit data updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts.json media-state.json media-review-queue.json last-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update media discovery state and review queue'
            git push
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-discovery-report
          path: |
            last-run.json
            media-review-queue.json
          if-no-files-found: warn
          retention-days: 5
