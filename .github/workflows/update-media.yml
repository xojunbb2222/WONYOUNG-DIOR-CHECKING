name: Discover global WONYOUNG Dior media

on:
  workflow_dispatch:
  # Post-show cost-saving mode: once per hour.
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: wonyoung-media-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'

      - name: Discover, scrape, refresh and auto-publish media
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python update_media.py

      - name: Commit live media data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts.json media-state.json media-review-queue.json last-run.json
          if ! git diff --cached --quiet; then
            git commit -m 'Auto-update Wonyoung Dior media feed'
            git push
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonyoung-media-run-report
          path: |
            last-run.json
            media-review-queue.json
          if-no-files-found: warn
          retention-days: 3
